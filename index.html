<!doctype html>
<html lang="ko" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>📝 깍두기 공책 생성기</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    .worksheet-paper {
      position: relative;
      border-radius: 28px;
      padding: 24px;
      background:
        linear-gradient(to bottom, #fffdf7, #fffaf0);
      overflow: hidden;
    }

    .kids-deco {
      position: absolute;
      font-size: 22px;
      opacity: 0.16;
      user-select: none;
      pointer-events: none;
    }

    .deco-star {
      top: 16px;
      right: 24px;
    }

    .deco-heart {
      top: 52px;
      right: 80px;
    }

    .deco-pencil {
      bottom: 18px;
      left: 18px;
    }

    .deco-cloud {
      bottom: 22px;
      right: 22px;
    }

    .student-info {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;

      margin-bottom: 20px;

      padding: 10px 14px;

      border: 2px dashed #f59e0b;

      border-radius: 14px;

      background: #fff7ed;

      font-size: 14px;
      font-weight: 700;

      color: #92400e;

      flex-wrap: nowrap;
    }

    .student-info span {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .info-line {
      display: inline-block;

      min-width: 45px;

      border-bottom: 2px solid #92400e;

      height: 18px;
    }

    .worksheet-grid {
      display: grid;
      gap: 0;
      margin-bottom: 12px;

      max-width: 100%;
      overflow: hidden;
    }

    .grid-cell {
      aspect-ratio: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1.5px solid #333;

      border-radius: 6px;

      background: white;

      flex-shrink: 0;
    }

    .grid-cell.empty-space {
      border: 1.5px solid #333;
    }

    .trace-mode {
      color: #e5e7eb;
    }

    .dictation-line {
      margin-bottom: 24px;
    }

    @page {
      size: A4;
      margin: 5mm;
    }

    @media print {

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;

        background: white !important;

        overflow: visible !important;
      }

      .no-print {
        display: none !important;
      }

      .print-area {
        width: 100%;
        margin: 0 auto !important;
        padding: 0 !important;
        background: white !important;
      }

      .worksheet-paper {
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: white !important;
      }

      .student-info {
        background: white !important;
      }

      .kids-deco {
        opacity: 0.12;
      }

      .grid-cell {
        border: 1.5px solid #333 !important;
        background: white !important;

        break-inside: avoid;
        page-break-inside: avoid;
      }

      .worksheet-grid {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body class="h-full overflow-auto bg-orange-50">

  <div class="w-full min-h-full p-4 md:p-8">

    <!-- HEADER -->
    <div class="no-print text-center mb-6">

      <h1
        class="text-3xl md:text-4xl font-black text-amber-900"
        style="font-family:'Gaegu',cursive">

        📝 깍두기 공책 생성기

      </h1>

      <p class="text-amber-700 mt-1 text-sm">
        문장을 입력하면 바로 학습지가 만들어져요!
      </p>
    </div>

    <!-- TABS -->
    <div class="no-print max-w-2xl mx-auto flex gap-2 mb-6">

      <button
        id="theme-grid"
        class="theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-4 border-amber-500 bg-amber-100 text-amber-900">

        📝 깍두기 공책

      </button>

      <button
        id="theme-dictation"
        class="theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-2 border-gray-300 bg-gray-100 text-gray-600">

        ✍️ 받아쓰기

      </button>

    </div>

    <!-- CONTROL -->
    <div
      class="no-print max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-5 mb-6 border-2 border-amber-200">

      <!-- GRID INPUT -->
      <div id="grid-input-section">

        <label
          for="sentence-input"
          class="block font-bold text-amber-900 mb-2 text-lg">

          ✏️ 문장 입력

        </label>

        <textarea
          id="sentence-input"
          rows="3"
          placeholder="예: 나는 오늘 학교에 갔어요."
          class="w-full border-2 border-amber-300 rounded-xl p-3 text-lg focus:outline-none focus:border-amber-500 resize-none"></textarea>

      </div>

      <!-- DICTATION INPUT -->
      <div id="dictation-input-section" class="hidden">

        <label class="block font-bold text-amber-900 mb-2 text-lg">

          ✏️ 받아쓰기 문제

        </label>

        <div id="dictation-inputs" class="space-y-2">

          <textarea
            class="dictation-input w-full border-2 border-amber-300 rounded-xl p-3"
            rows="2"
            placeholder="1번 문제"></textarea>

          <textarea
            class="dictation-input w-full border-2 border-amber-300 rounded-xl p-3"
            rows="2"
            placeholder="2번 문제"></textarea>

          <textarea
            class="dictation-input w-full border-2 border-amber-300 rounded-xl p-3"
            rows="2"
            placeholder="3번 문제"></textarea>

          <textarea
            class="dictation-input w-full border-2 border-amber-300 rounded-xl p-3"
            rows="2"
            placeholder="4번 문제"></textarea>

          <textarea
            class="dictation-input w-full border-2 border-amber-300 rounded-xl p-3"
            rows="2"
            placeholder="5번 문제"></textarea>

        </div>

        <button
          id="add-dictation-btn"
          class="mt-3 px-4 py-2 bg-amber-400 hover:bg-amber-500 text-white font-bold rounded-lg">

          ➕ 번호 추가

        </button>

      </div>

      <!-- OPTIONS -->
      <div class="mt-4 flex flex-wrap gap-4">

        <!-- SIZE -->
        <div>

          <span class="font-bold text-amber-900 text-sm block mb-1">
            칸 크기
          </span>

          <div class="flex gap-1">

            <button
              data-size="large"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800">

              크게

            </button>

            <button
              data-size="medium"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-400 text-white">

              보통

            </button>

            <button
              data-size="small"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800">

              작게

            </button>

          </div>
        </div>

        <!-- MODE -->
        <div>

          <span class="font-bold text-amber-900 text-sm block mb-1">
            출력 모드
          </span>

          <div class="flex gap-1">

            <button
              data-mode="normal"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-400 text-white">

              일반

            </button>

            <button
              data-mode="trace"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800">

              따라쓰기

            </button>

            <button
              data-mode="blank"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800">

              빈칸연습

            </button>

          </div>
        </div>

      </div>

      <!-- GENERATE -->
      <button
        id="generate-btn"
        class="mt-5 w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-xl rounded-xl transition-colors shadow-md">

        🎯 학습지 생성

      </button>

    </div>

    <!-- PRINT -->
    <div class="no-print max-w-2xl mx-auto mb-4 text-center">

      <button
        id="print-btn"
        class="hidden px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow transition-colors">

        🖨️ 인쇄 / PDF 저장

      </button>

    </div>

    <!-- PREVIEW -->
    <div
      id="preview"
      class="print-area max-w-4xl mx-auto bg-white rounded-[28px] shadow-xl border-[6px] border-amber-200"></div>

  </div>

  <script>

    let currentSize = 'medium';
    let currentMode = 'normal';
    let currentTheme = 'grid';
    let dictationCount = 5;

    const sizes = {

      large: {
        cell: 64,
        cols: 10,
        font: 32
      },

      medium: {
        cell: 48,
        cols: 15,
        font: 24
      },

      small: {
        cell: 34,
        cols: 20,
        font: 18
      }
    };

    function createWorksheetHeader() {

      const wrapper = document.createElement('div');

      wrapper.className = 'worksheet-paper';

      wrapper.innerHTML = `

        <div class="kids-deco deco-star">⭐</div>
        <div class="kids-deco deco-heart">💛</div>
        <div class="kids-deco deco-pencil">✏️</div>
        <div class="kids-deco deco-cloud">☁️</div>

        <div class="student-info">

          <span>
            🏫 반
            <span class="info-line"></span>
          </span>

          <span>
            🔢 번호
            <span class="info-line"></span>
          </span>

          <span>
            😊 이름
            <span class="info-line" style="min-width:80px;"></span>
          </span>

        </div>

      `;

      return wrapper;
    }

    function createGrid(chars, mode = 'normal') {

      const { cell, cols, font } = sizes[currentSize];

      const grid = document.createElement('div');

      grid.className = 'worksheet-grid';

      grid.style.gridTemplateColumns =
        `repeat(${cols}, minmax(0, ${cell}px))`;

      grid.style.width = 'fit-content';

      chars.forEach(ch => {

        const div = document.createElement('div');

        div.className =
          'grid-cell' + (ch === ' ' ? ' empty-space' : '');

        div.style.width = `${cell}px`;
        div.style.height = `${cell}px`;

        div.style.fontSize = `${font}px`;

        div.style.fontFamily = "'Noto Serif KR', serif";

        if (mode === 'trace') {
          div.classList.add('trace-mode');
        }

        if (mode === 'blank') {
          div.textContent = '';
        } else {
          div.textContent = ch === ' ' ? '' : ch;
        }

        grid.appendChild(div);
      });

      return grid;
    }

    function chunkArray(arr, size) {

      const result = [];

      for (let i = 0; i < arr.length; i += size) {
        result.push(arr.slice(i, i + size));
      }

      return result;
    }

    function renderSentence(target, text) {

      const cols = sizes[currentSize].cols;

      const chunks =
        chunkArray(text.split(''), cols);

      /* 따라쓰기 */

      if (currentMode === 'trace') {

        const answerLabel =
          document.createElement('p');

        answerLabel.textContent = '▼ 정답';

        answerLabel.className =
          'font-bold mb-2 text-amber-800';

        target.appendChild(answerLabel);

        chunks.forEach(chunk => {

          while (chunk.length < cols) {
            chunk.push(' ');
          }

          target.appendChild(
            createGrid(chunk, 'normal')
          );
        });

        const traceLabel =
          document.createElement('p');

        traceLabel.textContent = '▼ 따라쓰기';

        traceLabel.className =
          'font-bold mt-4 mb-2 text-amber-800';

        target.appendChild(traceLabel);

        chunks.forEach(chunk => {

          target.appendChild(
            createGrid(chunk, 'trace')
          );
        });

        return;
      }

      /* 빈칸연습 */

      if (currentMode === 'blank') {

        chunks.forEach(chunk => {

          while (chunk.length < cols) {
            chunk.push(' ');
          }

          target.appendChild(
            createGrid(chunk, 'blank')
          );
        });

        return;
      }

      /* 일반 */

      chunks.forEach(chunk => {

        while (chunk.length < cols) {
          chunk.push(' ');
        }

        target.appendChild(
          createGrid(chunk, 'normal')
        );
      });
    }

    function generateWorksheet() {

      const preview =
        document.getElementById('preview');

      preview.innerHTML = '';

      const paper = createWorksheetHeader();

      preview.appendChild(paper);

      if (currentTheme === 'grid') {

        const text =
          document.getElementById('sentence-input').value;

        if (!text.trim()) return;

        renderSentence(paper, text);

      } else {

        const inputs =
          document.querySelectorAll('.dictation-input');

        inputs.forEach((input, index) => {

          const text = input.value.trim();

          if (!text) return;

          const line = document.createElement('div');

          line.className = 'dictation-line';

          const title = document.createElement('p');

          title.textContent = `${index + 1}번`;

          title.className =
            'font-bold mb-2 text-amber-800';

          line.appendChild(title);

          paper.appendChild(line);

          renderSentence(line, text);
        });
      }

      document
        .getElementById('print-btn')
        .classList.remove('hidden');
    }

    /* 번호 추가 */

    document
      .getElementById('add-dictation-btn')
      .addEventListener('click', () => {

        dictationCount++;

        const textarea =
          document.createElement('textarea');

        textarea.className =
          'dictation-input w-full border-2 border-amber-300 rounded-xl p-3';

        textarea.rows = 2;

        textarea.placeholder =
          `${dictationCount}번 문제`;

        document
          .getElementById('dictation-inputs')
          .appendChild(textarea);
      });

    /* SIZE BUTTON */

    document
      .querySelectorAll('.size-btn')
      .forEach(btn => {

        btn.addEventListener('click', () => {

          currentSize = btn.dataset.size;

          document
            .querySelectorAll('.size-btn')
            .forEach(b => {

              b.className =
                'size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800';
            });

          btn.className =
            'size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-400 text-white';
        });
      });

    /* MODE BUTTON */

    document
      .querySelectorAll('.mode-btn')
      .forEach(btn => {

        btn.addEventListener('click', () => {

          currentMode = btn.dataset.mode;

          document
            .querySelectorAll('.mode-btn')
            .forEach(b => {

              b.className =
                'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800';
            });

          btn.className =
            'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-400 text-white';
        });
      });

    /* TAB */

    document
      .getElementById('theme-grid')
      .addEventListener('click', () => {

        currentTheme = 'grid';

        document
          .getElementById('grid-input-section')
          .classList.remove('hidden');

        document
          .getElementById('dictation-input-section')
          .classList.add('hidden');

        document
          .getElementById('theme-grid')
          .className =
          'theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-4 border-amber-500 bg-amber-100 text-amber-900';

        document
          .getElementById('theme-dictation')
          .className =
          'theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-2 border-gray-300 bg-gray-100 text-gray-600';
      });

    document
      .getElementById('theme-dictation')
      .addEventListener('click', () => {

        currentTheme = 'dictation';

        document
          .getElementById('grid-input-section')
          .classList.add('hidden');

        document
          .getElementById('dictation-input-section')
          .classList.remove('hidden');

        document
          .getElementById('theme-grid')
          .className =
          'theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-2 border-gray-300 bg-gray-100 text-gray-600';

        document
          .getElementById('theme-dictation')
          .className =
          'theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-4 border-amber-500 bg-amber-100 text-amber-900';
      });

    document
      .getElementById('generate-btn')
      .addEventListener('click', generateWorksheet);

    document
      .getElementById('print-btn')
      .addEventListener('click', () => {

        window.print();
      });

  </script>

</body>

</html>
