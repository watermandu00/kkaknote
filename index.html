<!doctype html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>깍두기 공책 생성기</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    .grid-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;

      border: 1.5px solid #333;
      background: #fff;
    }

    .grid-cell.empty-space {
      border-color: #999;
    }

    .trace-mode {
      color: #c7c7c7;
    }

    /* ---------------- PRINT ---------------- */

    @page {
      size: A4;
      margin: 10mm;
    }

    @media print {

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: white !important;
        overflow: visible !important;
      }

      .no-print {
        display: none !important;
      }

      .print-area {
        width: 100%;
        margin: 0 auto !important;
        padding: 8mm 10mm !important;

        background: white !important;

        box-sizing: border-box;
      }

      .grid-cell {
        border: 1.5px solid #333 !important;
        background: white !important;

        break-inside: avoid;
        page-break-inside: avoid;
      }

      .grid-cell.empty-space {
        border: 1.5px solid #999 !important;
      }

      .trace-mode {
        color: #999 !important;
      }

      .worksheet-grid {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body class="h-full overflow-auto bg-amber-50">

  <div class="w-full min-h-full p-4 md:p-8">

    <!-- Header -->
    <div class="no-print text-center mb-6">
      <h1
        class="text-3xl md:text-4xl font-black text-amber-900"
        style="font-family:'Gaegu',cursive"
      >
        📝 깍두기 공책 생성기
      </h1>

      <p class="text-amber-700 mt-1 text-sm">
        문장을 입력하면 바로 학습지가 만들어져요!
      </p>
    </div>

    <!-- Theme Tabs -->
    <div class="no-print max-w-2xl mx-auto flex gap-2 mb-6">

      <button
        id="theme-grid"
        class="theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-4 border-amber-500 bg-amber-100 text-amber-900"
      >
        📝 깍두기 공책
      </button>

      <button
        id="theme-dictation"
        class="theme-tab flex-1 px-4 py-2.5 rounded-t-xl font-bold text-lg border-b-2 border-gray-300 bg-gray-100 text-gray-600"
      >
        ✍️ 받아쓰기
      </button>

    </div>

    <!-- Controls -->
    <div class="no-print max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-5 mb-6 border-2 border-amber-200">

      <!-- Grid Input -->
      <div id="grid-input-section">

        <label
          for="sentence-input"
          class="block font-bold text-amber-900 mb-2 text-lg"
        >
          ✏️ 문장 입력
        </label>

        <textarea
          id="sentence-input"
          rows="3"
          placeholder="예: 나는 오늘 학교에 갔어요."
          class="w-full border-2 border-amber-300 rounded-xl p-3 text-lg focus:outline-none focus:border-amber-500 resize-none"
        ></textarea>

      </div>

      <!-- Dictation Input -->
      <div id="dictation-input-section" class="hidden">

        <label class="block font-bold text-amber-900 mb-2 text-lg">
          ✏️ 받아쓰기 문제
        </label>

        <div class="space-y-2 max-h-96 overflow-y-auto">
          <div id="dictation-inputs"></div>
        </div>

        <button
          id="add-dictation-btn"
          class="mt-3 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg text-sm"
        >
          + 문제 추가
        </button>

      </div>

      <!-- Options -->
      <div class="mt-4 flex flex-wrap gap-4">

        <!-- Size -->
        <div>

          <span class="font-bold text-amber-900 text-sm block mb-1">
            칸 크기
          </span>

          <div class="flex gap-1">

            <button
              data-size="large"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800"
            >
              크게
            </button>

            <button
              data-size="medium"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-400 text-white"
            >
              보통
            </button>

            <button
              data-size="small"
              class="size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800"
            >
              작게
            </button>

          </div>
        </div>

        <!-- Mode -->
        <div>

          <span class="font-bold text-amber-900 text-sm block mb-1">
            출력 모드
          </span>

          <div class="flex gap-1">

            <button
              data-mode="normal"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-400 text-white"
            >
              일반
            </button>

            <button
              data-mode="trace"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800"
            >
              따라쓰기
            </button>

            <button
              data-mode="blank"
              class="mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800"
            >
              빈칸연습
            </button>

          </div>
        </div>
      </div>

      <!-- Generate -->
      <button
        id="generate-btn"
        class="mt-5 w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-xl rounded-xl transition-colors shadow-md"
      >
        🎯 학습지 생성
      </button>

    </div>

    <!-- Print Button -->
    <div class="no-print max-w-2xl mx-auto mb-4 text-center">

      <button
        id="print-btn"
        class="hidden px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow transition-colors"
      >
        🖨️ 인쇄 / PDF 저장
      </button>

    </div>

    <!-- Preview -->
    <div id="preview" class="print-area max-w-4xl mx-auto"></div>

  </div>

  <script>

    let currentSize = 'medium';
    let currentMode = 'normal';
    let currentTheme = 'grid';

    let dictationItems = [];

    const sizes = {
      large:  { cell: 56, cols: 20, font: 28 },
      medium: { cell: 44, cols: 20, font: 22 },
      small:  { cell: 36, cols: 20, font: 18 }
    };

    /* ---------------- UTIL ---------------- */

    function createGrid(chars, mode = 'normal') {

      const { cell, cols, font } = sizes[currentSize];

      const grid = document.createElement('div');

      grid.className = 'worksheet-grid';

      grid.style.display = 'grid';

      grid.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;

      grid.style.width = `${cell * cols}px`;

      grid.style.gap = '0px';

      /* 핵심 수정 */
      grid.style.justifyContent = 'start';

      grid.style.marginBottom = '12px';

      chars.forEach(ch => {

        const div = document.createElement('div');

        div.className =
          'grid-cell' + (ch === ' ' ? ' empty-space' : '');

        div.style.width = cell + 'px';
        div.style.height = cell + 'px';

        div.style.fontSize = font + 'px';

        div.style.fontFamily = "'Noto Serif KR', serif";

        div.style.fontWeight = '400';

        if (mode === 'trace') {
          div.classList.add('trace-mode');
        }

        if (mode === 'blank') {
          div.textContent = '';
        } else {
          div.textContent = ch === ' ' ? '' : ch;
        }

        grid.appendChild(div);
      });

      return grid;
    }

    function chunkArray(arr, size) {

      const result = [];

      for (let i = 0; i < arr.length; i += size) {
        result.push(arr.slice(i, i + size));
      }

      return result;
    }

    /* ---------------- MODE UI ---------------- */

    function updateModeButtons() {

      const modeButtons = document.querySelectorAll('.mode-btn');

      if (currentTheme === 'grid') {

        const modes = ['normal', 'trace', 'blank'];

        const labels = ['일반', '따라쓰기', '빈칸연습'];

        modeButtons.forEach((btn, idx) => {

          btn.dataset.mode = modes[idx];

          btn.textContent = labels[idx];

          btn.className =
            currentMode === modes[idx]
              ? 'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-400 text-white'
              : 'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-teal-400 bg-teal-50 text-teal-800';
        });

      } else {

        const modes = [
          'dictation-problem',
          'dictation-answer',
          'dictation-trace'
        ];

        const labels = [
          '문제만',
          '답지만',
          '따라쓰기'
        ];

        modeButtons.forEach((btn, idx) => {

          btn.dataset.mode = modes[idx];

          btn.textContent = labels[idx];

          btn.className =
            currentMode === modes[idx]
              ? 'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-blue-400 bg-blue-400 text-white'
              : 'mode-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-blue-400 bg-blue-50 text-blue-800';
        });
      }
    }

    /* ---------------- TAB ---------------- */

    document.getElementById('theme-grid')
      .addEventListener('click', () => {

        currentTheme = 'grid';

        currentMode = 'normal';

        document
          .getElementById('grid-input-section')
          .classList.remove('hidden');

        document
          .getElementById('dictation-input-section')
          .classList.add('hidden');

        updateModeButtons();

        document.getElementById('preview').innerHTML = '';
      });

    document.getElementById('theme-dictation')
      .addEventListener('click', () => {

        currentTheme = 'dictation';

        currentMode = 'dictation-problem';

        document
          .getElementById('grid-input-section')
          .classList.add('hidden');

        document
          .getElementById('dictation-input-section')
          .classList.remove('hidden');

        renderDictationInputs();

        updateModeButtons();

        document.getElementById('preview').innerHTML = '';
      });

    /* ---------------- SIZE ---------------- */

    document.querySelectorAll('.size-btn')
      .forEach(btn => {

        btn.addEventListener('click', () => {

          currentSize = btn.dataset.size;

          document.querySelectorAll('.size-btn')
            .forEach(b => {

              b.className =
                'size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-800';
            });

          btn.className =
            'size-btn px-3 py-1.5 rounded-lg text-sm font-bold border-2 border-amber-400 bg-amber-400 text-white';
        });
      });

    /* ---------------- MODE BUTTON ---------------- */

    document.addEventListener('click', (e) => {

      if (!e.target.classList.contains('mode-btn')) return;

      currentMode = e.target.dataset.mode;

      updateModeButtons();

      if (currentTheme === 'dictation') {
        generateDictationWorksheet();
      }
    });

    /* ---------------- DICTATION INPUTS ---------------- */

    function renderDictationInputs() {

      const container = document.getElementById('dictation-inputs');

      container.innerHTML = '';

      for (let i = 1; i <= 10; i++) {

        const div = document.createElement('div');

        div.className = 'flex items-center gap-2';

        div.innerHTML = `
          <span class="font-bold text-amber-900 w-8">${i}.</span>

          <input
            type="text"
            class="dictation-input flex-1 border-2 border-amber-300 rounded-lg p-2 focus:outline-none focus:border-amber-500"
            placeholder="문장을 입력하세요"
            value="${dictationItems[i - 1] || ''}"
          >
        `;

        const input = div.querySelector('.dictation-input');

        input.addEventListener('change', () => {
          dictationItems[i - 1] = input.value;
        });

        container.appendChild(div);
      }
    }

    /* ---------------- GENERATE GRID ---------------- */

    function generateGridWorksheet() {

      const text =
        document.getElementById('sentence-input').value;

      if (!text.trim()) return;

      const chars = text.split('');

      const preview = document.getElementById('preview');

      preview.innerHTML = '';

      const chunks = chunkArray(chars, 20);

      chunks.forEach(chunk => {

        while (chunk.length < 20) {
          chunk.push(' ');
        }

        if (currentMode === 'blank') {

          const label1 = document.createElement('p');
          label1.textContent = '▼ 정답';
          label1.className = 'font-bold mb-2';

          preview.appendChild(label1);

          preview.appendChild(createGrid(chunk, 'normal'));

          const label2 = document.createElement('p');
          label2.textContent = '▼ 연습';
          label2.className = 'font-bold mt-4 mb-2';

          preview.appendChild(label2);

          preview.appendChild(createGrid(chunk, 'blank'));

        } else {

          preview.appendChild(
            createGrid(chunk, currentMode)
          );
        }
      });

      document
        .getElementById('print-btn')
        .classList.remove('hidden');
    }

    /* ---------------- GENERATE DICTATION ---------------- */

    function generateDictationWorksheet() {

      const preview = document.getElementById('preview');

      preview.innerHTML = '';

      const validItems =
        dictationItems.filter(v => v && v.trim());

      if (validItems.length === 0) return;

      validItems.forEach((item, idx) => {

        const wrapper = document.createElement('div');

        wrapper.style.marginBottom = '24px';

        const chunks = chunkArray(item.split(''), 20);

        function addNumber() {

          const p = document.createElement('p');

          p.textContent = `${idx + 1}.`;

          p.className =
            'font-bold text-amber-900 mb-2';

          p.style.fontSize = '16px';

          wrapper.appendChild(p);
        }

        function addGrid(mode) {

          chunks.forEach(chunk => {

            while (chunk.length < 20) {
              chunk.push(' ');
            }

            wrapper.appendChild(
              createGrid(chunk, mode)
            );
          });
        }

        if (currentMode === 'dictation-problem') {

          addNumber();
          addGrid('answer');

        } else if (currentMode === 'dictation-answer') {

          addNumber();
          addGrid('blank');

        } else {

          addNumber();
          addGrid('answer');

          addNumber();
          addGrid('trace');

          addNumber();
          addGrid('blank');
        }

        preview.appendChild(wrapper);
      });

      document
        .getElementById('print-btn')
        .classList.remove('hidden');
    }

    /* ---------------- BUTTONS ---------------- */

    document
      .getElementById('generate-btn')
      .addEventListener('click', () => {

        if (currentTheme === 'grid') {
          generateGridWorksheet();
        } else {
          generateDictationWorksheet();
        }
      });

    document
      .getElementById('print-btn')
      .addEventListener('click', () => {

        window.print();
      });

  </script>

</body>
</html>
